name: Build OBISI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          unzip -o OBISI_v2_Project_Files.zip
          echo "ZIP extracted"
          ls -la
          ls -la OBISI_v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: OBISI_v2
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OBISI-APK
          path: OBISI_v2/app/build/outputs/apk/debug/app-debug.apk
