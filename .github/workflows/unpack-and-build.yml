name: Build OBISI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir build_project
          unzip -q OBISI_v2_Firebase_Project.zip -d build_project
          echo "Project extracted:"
          find build_project -maxdepth 3 -type f | head -50

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd build_project/OBISI_v2
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OBISI-APK
          path: build_project/OBISI_v2/app/build/outputs/apk/debug/app-debug.apk
